plugins { id 'com.android.application' }

android {
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    useLibrary 'android.test.mock', false
    namespace 'io.github.xmy953538104.mybox'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId 'io.github.xmy953538104.mybox'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 3
        versionName '0.3.0-mylite-alpha'
        def sourceRevision = providers.environmentVariable('GITHUB_SHA').orElse('local-unidentified').get()
        manifestPlaceholders = [myboxSourceRevision: sourceRevision ==~ /[0-9a-f]{40}/ ? sourceRevision : 'local-unidentified']
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation project(':mylite-engine')

    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

android.sourceSets.androidTest.java.setSrcDirs(['src/reconstructionTest/java'])
tasks.register('stageEngineFixture', Copy) {
    dependsOn ':engine-fixture:assembleDebug'
    from project(':engine-fixture').layout.buildDirectory.file('outputs/apk/debug/engine-fixture-debug.apk')
    into layout.buildDirectory.dir('generated/engineFixture')
    rename { 'engine-fixture.apk' }
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/engineFixture')
tasks.matching { it.name.contains('AndroidTest') }.configureEach { dependsOn 'stageEngineFixture' }

tasks.register('stageAccountUiFixtures', Copy) {
    dependsOn ':account-ui-consumer:assembleDebug', ':account-ui-authenticator:assembleV1Debug', ':account-ui-authenticator:assembleV2Debug'
    from(project(':account-ui-consumer').layout.buildDirectory.file('outputs/apk/debug/account-ui-consumer-debug.apk')) {
        rename { 'account-ui-consumer.apk' }
    }
    from(project(':account-ui-authenticator').layout.buildDirectory.file('outputs/apk/v1/debug/account-ui-authenticator-v1-debug.apk')) {
        rename { 'account-ui-authenticator-v1.apk' }
    }
    from(project(':account-ui-authenticator').layout.buildDirectory.file('outputs/apk/v2/debug/account-ui-authenticator-v2-debug.apk')) {
        rename { 'account-ui-authenticator-v2.apk' }
    }
    into layout.buildDirectory.dir('generated/accountUiFixtures')
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/accountUiFixtures')
tasks.matching { it.name.contains('AndroidTest') }.configureEach { dependsOn 'stageAccountUiFixtures' }

tasks.register('stageBroadcastPermissionFixtures', Copy) {
    dependsOn ':broadcast-permission-target:assembleSameDebug', ':broadcast-permission-target:assembleDifferentDebug', ':broadcast-permission-target:assembleUnrequestedDebug'
    ['same', 'different', 'unrequested'].each { variant ->
        from(project(':broadcast-permission-target').layout.buildDirectory.file("outputs/apk/${variant}/debug/broadcast-permission-target-${variant}-debug.apk")) {
            rename { "broadcast-permission-${variant}.apk" }
        }
    }
    into layout.buildDirectory.dir('generated/broadcastPermissionFixtures')
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/broadcastPermissionFixtures')
tasks.matching { it.name.contains('AndroidTest') }.configureEach { dependsOn 'stageBroadcastPermissionFixtures' }
