plugins { id 'com.android.application' }
android {
    namespace 'io.github.xmy953538104.mybox.installtarget'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.xmy953538104.mybox.installtarget'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    flavorDimensions += 'revision'
    productFlavors {
        v1 { dimension 'revision'; versionCode 1; versionName '1' }
        v2 { dimension 'revision'; versionCode 2; versionName '2' }
    }
}
