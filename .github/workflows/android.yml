name: Mybox APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    uses: ./.github/workflows/host.yml

  microg:
    uses: ./.github/workflows/microg.yml

  bundle:
    needs: [host, microg]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: microg-nohms
          path: work/microg
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Bundle exact microG build
        run: |
          python3 scripts/bundle-microg.py work/microg
          bash gradlew --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mybox-dev.apk
          cp work/microg/artifact.json dist/microg-build.json
          python3 scripts/check-boundaries.py dist/Mybox-dev.apk
          cd dist
          sha256sum Mybox-dev.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Mybox-dev
          path: dist/
          if-no-files-found: error
