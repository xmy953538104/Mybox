name: Original native static investigation
on:
  workflow_dispatch:
    inputs:
      public_recipient_certificate:
        description: Public X509 certificate only; never a private key
        type: string
        required: true
permissions:
  contents: read
jobs:
  native-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate investigation boundaries
        run: |
          node scripts/analyze-original-native-cloud.mjs --self-test
          python3 scripts/run-original-native-cloud.py --self-test
      - name: Analyze pinned original native code without execution
        env:
          PUBLIC_RECIPIENT_CERTIFICATE: ${{ inputs.public_recipient_certificate }}
        run: python3 scripts/run-original-native-cloud.py
      - name: Retain ciphertext and fixed-schema metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-native-static
          path: work/native-public/
          if-no-files-found: error
          retention-days: 14
