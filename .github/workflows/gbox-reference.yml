name: Original GBox reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare official reference only
        run: |
          mkdir -p work/reference work/reference-observation
          curl --fail --location --connect-timeout 20 --max-time 300 --output work/reference/gbox.apk https://files.gboxlab.com/GBox-1.8.3.32-1080332-7848795-website.apk
          echo '6fcbaafbcb033b9e0cc03a5d6acaa54ca6b6cb06d16ce3c2d0657d7addfba257  work/reference/gbox.apk' | sha256sum -c -
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs work/reference/gbox.apk > work/reference-observation/apk-signature.txt
          sha256sum work/reference/gbox.apk > work/reference-observation/source-sha256.txt
      - name: Enable disposable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe original on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop qemu.hw.mainkeys=0
          script: bash scripts/capture-original-reference.sh
      - name: Retain observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-gbox-reference
          path: work/reference-observation/
          if-no-files-found: error
          retention-days: 7
