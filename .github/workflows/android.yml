name: Mybox APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      microg_run_id:
        description: 'Optional same-repository run containing microg-nohms; source, patches and hashes must match.'
        required: false
        type: string
      google_registration_probe:
        description: 'Run the real anonymous device-registration flow; failures remain failures.'
        required: false
        default: false
        type: boolean
      play_journey_probe:
        description: 'Use an official Play Store image and exercise Store -> Google form -> system back, without account entry.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mybox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    uses: ./.github/workflows/host.yml

  microg:
    if: ${{ !github.event.inputs.microg_run_id }}
    uses: ./.github/workflows/microg.yml

  bundle:
    needs: [host, microg]
    if: ${{ !cancelled() && needs.host.result == 'success' && (needs.microg.result == 'success' || (needs.microg.result == 'skipped' && github.event.inputs.microg_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: microg-nohms
          path: work/microg
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.microg_run_id || github.run_id }}
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Bundle exact microG build
        env:
          MICROG_SOURCE_RUN: ${{ github.event.inputs.microg_run_id || github.run_id }}
        run: |
          python3 scripts/bundle-microg.py work/microg
          bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mybox-dev.apk
          cp work/microg/artifact.json dist/microg-build.json
          printf '%s\n' "$MICROG_SOURCE_RUN" > dist/microg-source-run.txt
          python3 scripts/audit-reconstructed-apk.py dist/Mybox-dev.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cd dist
          sha256sum Mybox-dev.apk > SHA256SUMS
      - name: Enable KVM on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify bundled APK on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MYLITE_GOOGLE_REGISTRATION_PROBE: ${{ github.event.inputs.google_registration_probe || 'false' }}
          MYLITE_PLAY_JOURNEY_PROBE: ${{ github.event.inputs.play_journey_probe || 'false' }}
        with:
          api-level: 34
          target: ${{ github.event.inputs.play_journey_probe == 'true' && 'google_apis_playstore' || 'google_apis' }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-reconstruction-runtime.sh --bundled-google
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundled-runtime-diagnostics
          path: work/runtime/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Mybox-dev
          path: dist/
          if-no-files-found: error
