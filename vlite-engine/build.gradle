plugins { id 'com.android.library' }
android {
    namespace 'io.github.xmy953538104.mybox.engine'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 26
        targetSdk 28
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    testImplementation 'junit:junit:4.13.2'
}

// The public development certificate alone never authorizes an installer.
tasks.register('stageInstallerFixtureTrust') {
    dependsOn ':engine-fixture:assembleDebug'
    def fixtureApk = project(':engine-fixture').layout.buildDirectory.file('outputs/apk/debug/engine-fixture-debug.apk')
    def trustFile = layout.buildDirectory.file('generated/installerFixture/mybox/trusted-installer-fixture.properties')
    inputs.file fixtureApk
    outputs.file trustFile
    doLast {
        def apk = fixtureApk.get().asFile
        def result = new com.android.apksig.ApkVerifier.Builder(apk).build().verify()
        if (!result.isVerified() || result.signerCertificates.size() != 1) {
            throw new GradleException('The installer fixture must have exactly one verified APK signer')
        }
        def sha256 = { bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        def output = trustFile.get().asFile
        output.parentFile.mkdirs()
        output.setText('fixture.package=io.github.xmy953538104.mybox.fixture\n' +
                'fixture.apk.sha256=' + sha256(apk.bytes) + '\n' +
                'fixture.cert.sha256=' + sha256(result.signerCertificates[0].encoded) + '\n', 'UTF-8')
    }
}
android.sourceSets.debug.assets.srcDir layout.buildDirectory.dir('generated/installerFixture')
tasks.matching { it.name == 'mergeDebugAssets' }.configureEach { dependsOn 'stageInstallerFixtureTrust' }
