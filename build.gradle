plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
}
ext {
    compileSdkVersion = 35
    buildToolsVersion = '35.0.0'
    minSdkVersion = 26
    // shortcut: the inspected VLite host targets 28; raise after verifying the reconstructed runtime.
    targetSdkVersion = 28
    blackReflection = '1.1.2'
}

subprojects {
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.matching { it.name.endsWith('Aidl') }.configureEach {
        doLast {
            // SDK 35 writes Windows paths containing backslash-u into a Java comment.
            fileTree(layout.buildDirectory.dir('generated/aidl_source_output_dir')).matching {
                include '**/*.java'
            }.each { generated ->
                def source = generated.getText('UTF-8')
                def normalized = source.replaceAll('(?m)^ \\* Using:.*$', ' * Generated by Android AIDL.')
                if (source != normalized) generated.setText(normalized, 'UTF-8')
            }
        }
    }
}
