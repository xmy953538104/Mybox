plugins { id 'com.android.application' }

android {
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    useLibrary 'android.test.mock', false
    namespace 'io.github.xmy953538104.mybox'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId 'io.github.xmy953538104.mybox'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 3
        versionName '0.3.0-mylite-alpha'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation project(':mylite-engine')

    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

android.sourceSets.androidTest.java.setSrcDirs(['src/reconstructionTest/java'])
tasks.register('stageEngineFixture', Copy) {
    dependsOn ':engine-fixture:assembleDebug'
    from project(':engine-fixture').layout.buildDirectory.file('outputs/apk/debug/engine-fixture-debug.apk')
    into layout.buildDirectory.dir('generated/engineFixture')
    rename { 'engine-fixture.apk' }
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/engineFixture')
tasks.matching { it.name.contains('AndroidTest') }.configureEach { dependsOn 'stageEngineFixture' }
