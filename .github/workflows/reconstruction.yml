name: Original GBox startup oracle only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Obtain and verify exact user reference as ephemeral data
        run: |
          sdkmanager 'build-tools;35.0.0'
          mkdir -p work/reference work/oracle
          python3 scripts/probe-gbox-oracle.py --self-test
          curl --fail --location --connect-timeout 20 --max-time 300 --output work/reference/gbox.apk https://files.gboxlab.com/GBox-1.8.3.32-1080332-7848795-website.apk
          echo '6fcbaafbcb033b9e0cc03a5d6acaa54ca6b6cb06d16ce3c2d0657d7addfba257  work/reference/gbox.apk' | sha256sum -c -
          sha256sum work/reference/gbox.apk > work/oracle/source-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs work/reference/gbox.apk > work/oracle/source-signature.txt
      - name: Enable KVM on this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe original without HMS or account interaction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/probe-gbox-oracle.py --cloud work/reference/gbox.apk work/oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-gbox-startup-observation
          path: work/oracle/
          if-no-files-found: error
