name: microG without HMS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify build audit
        run: python3 microg-patches/audit_apk.py --self-test
      - name: Build pinned mapbox/default microG
        run: bash scripts/build-microg.sh
      - name: Upload verified service and exact trust pins
        uses: actions/upload-artifact@v4
        with:
          name: microg-nohms
          path: dist/microg/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: microg-build-diagnostics
          path: |
            dist/microg/*.txt
            dist/microg/*.log
            .build/microg/**/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7
