    namespace 'io.github.xmy953538104.mybox.networkfixture'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.xmy953538104.mybox.networkfixture'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1'
    }
    flavorDimensions += 'policy'
