plugins { id 'com.android.application' }

android {
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    useLibrary 'android.test.mock', false
    namespace 'io.github.xmy953538104.mybox'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId 'io.github.xmy953538104.mybox'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/development.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation project(':Bcore')
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

tasks.register('stageProbe', Copy) {
    dependsOn ':probe:assembleDebug'
    from project(':probe').layout.buildDirectory.file('outputs/apk/debug/probe-debug.apk')
    into layout.buildDirectory.dir('generated/probeAssets')
    rename { 'probe.apk' }
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/probeAssets')
tasks.matching { it.name.contains('AndroidTest') }
        .configureEach { dependsOn 'stageProbe' }
